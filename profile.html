<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Pokémon Club</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f4f8; color: #444; }

        /* Shared Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: #2a75bb; color: white; }
        .logo { font-weight: bold; font-size: 22px; color: white; text-decoration: none; }
        .btn-signin { padding: 8px 16px; background: #fccf00; color: #333; text-decoration: none; border-radius: 8px; font-weight: bold; }

        /* Profile Layout */
        .container { display: grid; grid-template-columns: 350px 1fr; gap: 30px; padding: 40px 5%; max-width: 1200px; margin: 0 auto; }

        /* Account Info Card */
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .avatar-lg { font-size: 60px; text-align: center; margin-bottom: 15px; }
        .info-group { margin-bottom: 20px; border-bottom: 1px solid #edf2f7; padding-bottom: 15px; }
        .info-group label { display: block; font-size: 12px; font-weight: bold; color: #a0aec0; text-transform: uppercase; margin-bottom: 5px; }
        .info-group .data { font-size: 18px; font-weight: 600; color: #2d3748; }

        /* Activity Board */
        .activity-header { margin-bottom: 20px; color: #2d3748; font-size: 24px; }
        .activity-list { list-style: none; }
        .activity-item { background: white; padding: 20px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); border-left: 5px solid #50b47b; }
        .activity-title { font-weight: bold; color: #2a75bb; font-size: 16px; margin-bottom: 5px; }
        .activity-meta { font-size: 12px; color: #a0aec0; }
        
        .btn-edit { display: block; width: 100%; padding: 12px; background: #e2e8f0; color: #4a5568; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        .btn-edit:hover { background: #cbd5e0; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ Pokémon Club</a>
        <a href="#" class="btn-signin">Sign In</a>
    </header>

    <div class="container">
        <div class="card">
            <div class="avatar-lg">👤</div>
            
            <div class="info-group">
                <label>Trainer Name</label>
                <div class="data" id="profile-username">Loading...</div>
            </div>
            
            <div class="info-group">
                <label>Email Address</label>
                <div class="data" id="profile-email">Loading...</div>
            </div>

            <div class="info-group">
                <label>Club Status</label>
                <div class="data">🟢 Active Member</div>
            </div>

            <a href="#" class="btn-edit" onclick="alert('Update form coming soon!')">⚙️ Edit Account Details</a>
        </div>

        <div>
            <h2 class="activity-header">📋 Your Bulletin Board Activity</h2>
            <ul class="activity-list" id="activity-feed">
                </ul>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="profile.js"></script>
</body>
</html>
